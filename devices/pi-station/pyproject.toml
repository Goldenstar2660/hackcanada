[project]
name = "binsight-station"
version = "0.1.0"
description = "Raspberry Pi station runtime for Binsight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.3,<3.0.0",
    "Pillow>=11.1.0,<12.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tflite-runtime>=2.14.0,<3.0.0; sys_platform == 'linux' and python_version < '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
]

[project.scripts]
binsight-station = "binsight_station.main:main"
binsight-training-capture = "binsight_station.training_capture:main"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
