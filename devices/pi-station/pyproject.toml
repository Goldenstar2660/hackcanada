[project]
name = "binsight-station"
version = "0.1.0"
description = "Raspberry Pi station runtime for Binsight"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gpiozero>=2.0.1,<3.0.0",
    "lgpio>=0.2.2.0,<1.0.0; platform_system == 'Linux' and (platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l')",
    "mediapipe==0.10.14; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "mediapipe>=0.10.14,<0.11.0; platform_system != 'Linux' or platform_machine != 'aarch64'",
    "numpy>=1.26.4,<2.0.0",
    "Pillow>=11.1.0,<12.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tflite-runtime>=2.14.0,<3.0.0; sys_platform == 'linux' and python_version < '3.13'",
    "google-genai>=0.8.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
]

[project.scripts]
binsight-station = "binsight_station.main:main"
binsight-training-capture = "binsight_station.training_capture:main"
binsight-realtime-sim = "binsight_station.simulation:main"
binsight-live-demo = "binsight_station.live_demo:main"
binsight-live-sequence = "binsight_station.live_demo:sequence_main"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
